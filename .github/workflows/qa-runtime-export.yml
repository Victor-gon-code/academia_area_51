name: qa-runtime-export

on:
  push:
    branches: [feat/area51-v1]
    paths:
      - "qa/RUNTIME"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund
      - run: npm run build

      - name: Assemble standalone runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/.next
          cp -R .next/standalone/. runtime/
          cp -R .next/static runtime/.next/static
          mkdir -p runtime/public

      - uses: actions/upload-artifact@v4
        with:
          name: area51-runtime
          path: runtime
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
