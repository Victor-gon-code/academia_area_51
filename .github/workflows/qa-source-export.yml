name: qa-source-export

on:
  push:
    branches: [feat/area51-v1]
    paths:
      - "qa/EXPORT"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: area51-source
          path: |
            app
            components
            sections
            lib
            docs
            package.json
            tsconfig.json
            next.config.ts
            eslint.config.mjs
            next-env.d.ts
            README.md
            .nvmrc
          if-no-files-found: error
          retention-days: 1
