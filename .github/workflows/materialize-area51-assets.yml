name: materialize-area51-assets

on:
  push:
    branches: [feat/area51-v1]
    paths:
      - "asset-payload/READY"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/area51-v1

      - name: Materialize optimized real assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/area51

          if [ -s asset-payload/assets.zip ]; then
            cp asset-payload/assets.zip /tmp/area51-assets.zip
          else
            cat asset-payload/assets.zip.b64.* | base64 --decode > /tmp/area51-assets.zip
          fi

          unzip -o /tmp/area51-assets.zip -d public/assets/area51

          required=(bathroom climb entrance facade functional interior-main logo shop weights)
          for name in "${required[@]}"; do
            test -s "public/assets/area51/${name}.avif"
          done

          file public/assets/area51/*.avif
          rm -rf asset-payload

      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "assets: add optimized real Area 51 photography"
          git push origin HEAD:feat/area51-v1
